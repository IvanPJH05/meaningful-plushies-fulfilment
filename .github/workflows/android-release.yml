name: Publish signed Android update
on:
  push:
    branches: [codex/permanent-android-release]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Verify summaries and application types
        run: |
          node --experimental-strip-types --test lib/manual-order-notification.test.ts
          npm run typecheck
      - name: Restore signing and Firebase configuration
        env:
          SIGNING_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          FIREBASE_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$SIGNING_BASE64" && test -n "$FIREBASE_BASE64"
          printf '%s' "$SIGNING_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.p12"
          printf '%s' "$FIREBASE_BASE64" | base64 --decode > android/app/google-services.json
          chmod 600 "$RUNNER_TEMP/android-release.p12" android/app/google-services.json
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.p12" >> "$GITHUB_ENV"
          node -e 'const c=require("./android/app/google-services.json");if(c.project_info.project_id!=="meaningful-fulfilment"||!c.client.some(x=>x.client_info.android_client_info.package_name==="com.meaningfulplushies.fulfilment"))throw Error("Wrong Firebase configuration")'
      - run: npm run mobile:sync
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x android/gradlew
      - name: Build signed replacement
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: android
      - name: Verify signature, version and Firebase resources
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -qi '1dccf60a09f3edd9c9be3d50a938fb1d9f7a242c22afc926c26843ccd9f6cc3d' "$RUNNER_TEMP/apk-signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          head -1 "$RUNNER_TEMP/apk-badging.txt" | tee "$RUNNER_TEMP/apk-version.txt"
          grep -q "versionCode='22'" "$RUNNER_TEMP/apk-version.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump resources "$APK" > "$RUNNER_TEMP/apk-resources.txt"
          grep -q 'google_app_id' "$RUNNER_TEMP/apk-resources.txt"
          cp "$APK" app-debug.apk
          sha256sum app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: meaningful-fulfilment-v1.22-signed
          path: |
            app-debug.apk
            app-debug.apk.sha256
      - name: Publish to the app Updates screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.22 app-debug.apk app-debug.apk.sha256 --target "$GITHUB_SHA" --title "Meaningful Fulfilment v1.22" --notes-file docs/android-v1.22-release.md --latest
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.p12" android/app/google-services.json
